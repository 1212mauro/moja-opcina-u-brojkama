[project]
name = "opcina-pipeline"
version = "0.4.0"
description = "Data pipeline for Moja općina u brojkama: fetches, parses and joins open data on Croatian municipalities"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "polars>=2.0",
    "pyproj>=3.6",
    "pydantic>=2.11",  # serialize_by_alias
    "shapely>=2.1",  # coverage_simplify
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
opcina = "opcina_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
