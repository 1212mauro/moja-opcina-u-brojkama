# Where each municipality publishes its monthly payment disclosures (Naputak, NN 59/23).
# Keyed by DZS/LAU code. Supported platforms:
#
#   otvorenigrad  Otvoreni grad iTransparentnost API; `tenant` is the LC-Tenant header
#   kipos         Kipos transparency portal; `base_url` is the municipality's subdomain
#   html_links    files linked from one page; `page` and a regex `pattern` for the links
#   proracunhr    proracun.hr payment list; `kid` is the municipality's id there
#   official_csv  a publisher's official CSV export; `url` (see Varaždin below)
#   unavailable   no machine-readable route; `reason` is shown on the coverage map
#
# `pending_access`: the publisher refuses our automated requests (HTTP 401/403) and
# no other machine-readable copy exists. Such a refusal is reported, not failed; if
# the publisher starts answering, the fetch succeeds again on its own.

# Not configured: Ivanec and Ludbreg (Otvoreni grad, which refuses GitHub Actions with
# HTTP 403). No other open copy of their payments exists (checked Nov 2026;
# docs/sources.md), so they are not pilots. `pending_access` stays supported for a
# publisher that refuses us but may start answering.

["01511"]  # Breznički Hum
platform = "html_links"
page = "https://www.breznicki-hum.hr/index.php/vazni-dokumenti/transparentnost"
pattern = '/images/isplate_iz_proracuna/\d{4}/[^"]+\.ods'

["04723"]  # Varaždin
# The city's access point for programmatic export (Grad Varaždin, reply of Nov 2026:
# GetExport takes the search as URL parameters, exportType picks the format). Not the
# portal's search, which reCAPTCHA checks. One request per month (`{year}`,
# `{month_int}`): all payers (Uprave=0), euro (Valuta=191), payments (IsplataUplata=10),
# up to `max_rows` records (uzmi), CSV (exportType=1). A full month is ~2,300 rows.
platform = "official_csv"
url = "https://transparentni.varazdin.hr/Pretraga/GetExport/Godine%3D{year}%26Mjeseci%3D{month_int}%26Uprave%3D0%26Poslovnice%3D%26VrsteIzdataka%3D%26GodinaIsplate%3D%26IbanIsplate%3D%26OIBPrimatelja%3D%26NazivPrimatelja%3D%26MjestoPrimatelja%3D%26PTTPrimatelja%3D%26OpisIsplate%3D%26IznosObveze%3D%26OpisKnjizenja%3D%26IznosIsplateOd%3D%26IznosIsplateDo%3D%26Valuta%3D191%26IsplataUplata%3D10%26preskoci%3D0%26uzmi%3D10000%26RazdobljeOd%3D%26RazdobljeDo%3D?exportType=1"
max_rows = 10000

["01651"]  # Jalžabet
platform = "kipos"
base_url = "https://transparentnost-jalzabet.kipos.hr"

["02291"]  # Lepoglava
platform = "proracunhr"
kid = 37

["02607"]  # Maruševec
platform = "kipos"
base_url = "https://transparentnost-marusevec.kipos.hr"

["04383"]  # Sveti Ilija
platform = "kipos"
base_url = "https://transparentnost-sveti-ilija.kipos.hr"
