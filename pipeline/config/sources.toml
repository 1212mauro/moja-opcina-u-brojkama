# Every open-data source the pipeline reads, fetched automatically by `opcina fetch`.
#
# Each source writes to data/raw/<key>/; `file` is what parsers read, relative to
# data/raw/. Keys other than title/publisher/page/url/licence/file are options for
# that source's fetcher (see pipeline/src/opcina_pipeline/fetch/). Human-readable
# documentation of each source lives in docs/sources.md.

[minfin_budget]
title = "Financijski izvještaji JLP(R)S, PR-RAS i RAS-funkcijski (EUR)"
publisher = "Ministarstvo financija"
page = "https://mfin.gov.hr/istaknute-teme/lokalna-samouprava/financijski-izvjestaji-jlp-r-s/203"
url = "https://mfin.gov.hr/istaknute-teme/lokalna-samouprava/financijski-izvjestaji-jlp-r-s/203"
licence = "Javno objavljeni podaci (licenca nije navedena)"
file = "minfin_budget/county.xlsx"
# The section page links one page per period ("...-2019-2025-euro/3922"); the newest
# period page links the zip with one workbook per county.
period_page_pattern = '/istaknute-teme/lokalna-samouprava/financijski-izvjestaji-jlp-r-s/pr-ras-i-ras-funkc-za-razdoblje-(\d{4})-(\d{4})-euro/\d+'
zip_pattern = '[^"\x27]*EURO\.zip'

[minfin_budget_users]
title = "Registar proračunskih i izvanproračunskih korisnika"
publisher = "Ministarstvo financija"
page = "https://rkpfi.drzavna-riznica.hr/PORTAL/Rkp"
url = "https://rkpfi.drzavna-riznica.hr/PORTAL/Rkp/Export"
licence = "Otvorena dozvola Republike Hrvatske"
file = "minfin_budget_users/rkp_register.xlsx"
# Sheet 2 holds only the export timestamp, which changes on every download.
ignore_parts = ["xl/worksheets/sheet2.xml"]

[lau_codes]
title = "Local Administrative Units (LAU)"
publisher = "Eurostat"
page = "https://ec.europa.eu/eurostat/web/nuts/local-administrative-units"
url = "https://ec.europa.eu/eurostat/web/nuts/local-administrative-units"
licence = "© Europska unija, ponovna uporaba uz navođenje izvora"
file = "lau_codes/lau.xlsx"
# Newest "EU-27-LAU-<year>-NUTS-<year>.xlsx" linked from the page; "Census" files are skipped.
link_pattern = '/eurostat/documents/[^"]*/EU-27-LAU-(\d{4})-NUTS-\d{4}\.xlsx[^"]*'

[dzs_population]
title = "Popis stanovništva 2021, stanovništvo po gradovima/općinama"
publisher = "Državni zavod za statistiku"
page = "https://dzs.gov.hr/u-fokusu/popis-2021/88"
url = "https://podaci.dzs.hr/media/td3jvrbu/popis_2021-stanovnistvo_po_gradovima_opcinama.xlsx"
licence = "Slobodno korištenje uz navođenje izvora (DZS)"
file = "dzs_population/census_2021_municipalities.xlsx"

[dzs_settlements]
title = "Popis stanovništva 2021, stanovništvo po naseljima"
publisher = "Državni zavod za statistiku"
page = "https://dzs.gov.hr/u-fokusu/popis-2021/88"
url = "https://podaci.dzs.hr/media/rqybclnx/popis_2021-stanovnistvo_po_naseljima.xlsx"
licence = "Slobodno korištenje uz navođenje izvora (DZS)"
file = "dzs_settlements/census_2021_settlements.xlsx"

[dzs_estimates]
title = "Gradovi u statistici: procjena stanovništva"
publisher = "Državni zavod za statistiku"
page = "https://podaci.dzs.hr/hr/podaci/stanovnistvo/procjena-stanovnistva/"
url = "https://podaci.dzs.hr/media/bz5hplcj/gradovi-u-statistici.xlsx"
licence = "Slobodno korištenje uz navođenje izvora (DZS)"
file = "dzs_estimates/estimates.xlsx"

[postcodes]
title = "Naselja i odredišni poštanski uredi"
publisher = "Hrvatska pošta d.d."
page = "https://data.gov.hr/ckan/dataset/naselje-i-odredisni-postanski-ured"
url = "https://www.posta.hr/mjestaRh.aspx"
licence = "Licenca nije navedena"
file = "postcodes/mjesta.xlsx"

[dgu_boundaries]
title = "INSPIRE Administrative Units (AU)"
publisher = "Državna geodetska uprava"
page = "https://geoportal.dgu.hr/services/atom/au/xml"
url = "https://geoportal.dgu.hr/services/atom/au/xml"
licence = "Otvorena dozvola Republike Hrvatske"
file = "dgu_boundaries/municipalities.geojson"

[schools_primary]
title = "Osnovne škole (e-Matica)"
publisher = "Ministarstvo znanosti, obrazovanja i mladih"
page = "https://data.gov.hr/ckan/dataset/osnovne-skole"
url = "https://data.gov.hr/ckan/api/3/action/package_show?id=osnovne-skole"
licence = "Otvorena dozvola Republike Hrvatske"
file = "schools_primary"
ckan_dataset = "osnovne-skole"
formats = ["JSON"]

[schools_secondary]
title = "Srednje škole (e-Matica)"
publisher = "Ministarstvo znanosti, obrazovanja i mladih"
page = "https://data.gov.hr/ckan/dataset/srednje-skole"
url = "https://data.gov.hr/ckan/api/3/action/package_show?id=srednje-skole"
licence = "Otvorena dozvola Republike Hrvatske"
file = "schools_secondary"
ckan_dataset = "srednje-skole"
formats = ["JSON"]

[kindergartens]
title = "Dječji vrtići (e-Matica)"
publisher = "Ministarstvo znanosti, obrazovanja i mladih"
page = "https://data.gov.hr/ckan/dataset/djecji-vrtici"
url = "https://data.gov.hr/ckan/api/3/action/package_show?id=djecji-vrtici"
licence = "Otvorena dozvola Republike Hrvatske"
file = "kindergartens"
ckan_dataset = "djecji-vrtici"
formats = ["JSON"]

[osm_facilities]
title = "OpenStreetMap: schools, kindergartens, health facilities"
publisher = "OpenStreetMap contributors"
page = "https://www.openstreetmap.org/copyright"
url = "https://overpass-api.de/api/interpreter"
licence = "ODbL 1.0"
file = "osm_facilities/overpass.json"
# Tried in order; public Overpass instances are often overloaded.
endpoints = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
]

[payments]
title = "Informacije o trošenju sredstava (isplate iz proračuna)"
publisher = "Gradovi i općine"
page = "https://narodne-novine.nn.hr/clanci/sluzbeni/2023_06_59_1003.html"
url = "https://narodne-novine.nn.hr/clanci/sluzbeni/2023_06_59_1003.html"
licence = "Licencu ne navode gradovi i općine koji objavljuju"
file = "payments"
# Which platform each municipality publishes on: pipeline/config/payments.toml
months = 13

[contracts_municipal]
title = "Registri ugovora gradova i općina (data.gov.hr)"
publisher = "Gradovi i općine (Ivanec, Lepoglava, Varaždinske Toplice)"
page = "https://data.gov.hr/"
url = "https://data.gov.hr/ckan/api/3/action/package_show"
licence = "Otvorena dozvola Republike Hrvatske"
file = "contracts_municipal"
formats = ["XLSX"]
# Registers that publishers in scope put on data.gov.hr themselves; files land in
# a folder named after the publisher's OIB, which is the buyer of every row.
datasets = [
  { oib = "84121580205", name = "Grad Ivanec", ckan_dataset = "247c96e7-fcce-42e5-8119-334f702f8c61" },
  { oib = "79368224789", name = "Grad Lepoglava", ckan_dataset = "69435ebb-9985-4795-b976-1cadd9d3ab1d" },
  { oib = "54177232254", name = "Grad Varaždinske Toplice", ckan_dataset = "21f0a9ff-a3cc-411b-8e79-700f33b600bd" },
]

[contracts_eojn_legacy]
title = "Registar ugovora, stari EOJN RH (2018-2023)"
publisher = "Narodne novine d.d. (EOJN RH)"
page = "https://eojn.nn.hr/Oglasnik/"
url = "https://eojn.nn.hr/Spin/application/ipn/JavniReporti/RptRegistarUgovora.aspx"
licence = "Javno objavljeni podaci (licenca nije navedena)"
file = "contracts_eojn_legacy"
# 2 polite requests per buyer (~20 min for a county); the old system rarely changes.
refresh_days = 7

[contracts_eojn]
title = "Registar ugovora, EOJN RH (od 2024)"
