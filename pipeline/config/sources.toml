page = "https://eojn.hr/"
url = "https://eojn.hr/api/public/eProcurementData/"
licence = "Javno objavljeni podaci (licenca nije navedena)"
file = "contracts_eojn/contracts.jsonl"

[contracts_ted]
title = "TED: obavijesti o dodjeli ugovora (od 2024)"
