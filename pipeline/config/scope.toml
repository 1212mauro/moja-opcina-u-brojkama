# Which part of Croatia the pipeline covers. The datathon MVP covers one county
# so that peer comparison works; production v1 widens this to all 21 counties.

[county]
name = "Varaždinska"
register_code = "5"            # "Statistička oznaka županije" in the MinFin RKP register
nuts3 = "HR062"                # NUTS3 code in the Eurostat LAU list
postal_name = "Varaždinska županija"  # "Zupanija" in the Hrvatska pošta settlement list
census_name = "Varaždinska"    # "Županija" in DZS census tables

# Pilot municipalities (task B1), by DZS/LAU code: units whose every source, payments
# included, is open. See docs/pilots.md for why.
[pilots]
lau_codes = [
  "02291",  # Lepoglava (grad, 3,000-10,000)
  "02607",  # Maruševec (općina, 3,000-10,000)
  "04383",  # Sveti Ilija (općina, 3,000-10,000)
  "01651",  # Jalžabet (općina, 3,000-10,000)
  "01511",  # Breznički Hum (općina, under 3,000)
]
