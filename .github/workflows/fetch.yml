name: Fetch and build data

# Nightly: download every source (C1), parse, run the quality gate (C10) and export
# the website's JSON (C11). data/raw/ and data/interim/ are carried between runs in
# the Actions cache: unchanged files are not downloaded again, the gate compares
# with the last published tables, and geocoding answers are reused. A failed source
# or a table that fails the gate fails the job, which emails the maintainer; the
# last good data stays in place.

on:
  schedule:
    - cron: "30 3 * * *"  # 03:30 UTC, after MinFin/DZS overnight publishing
  workflow_dispatch:
    inputs:
      accept:
        description: "Tables whose row-count jump is expected (space-separated, e.g. contract)"
        required: false
        default: ""
  pull_request:
    paths:
      - "pipeline/src/opcina_pipeline/fetch/**"
      - "pipeline/config/sources.toml"
      - "pipeline/config/payments.toml"
      - "pipeline/config/budget_layout.toml"
      - "pipeline/src/opcina_pipeline/parse/**"
      - "pipeline/src/opcina_pipeline/export.py"
      - "pipeline/src/opcina_pipeline/quality.py"
      - ".github/workflows/fetch.yml"

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Weekly old-EOJN crawl ~20 min + EOJN API (capped per run) ~5 min + the rest.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - run: pip install -c requirements.lock -e .

      - name: Restore data from the previous run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/interim
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch all sources
        id: fetch
        run: opcina fetch
        env:
          EOJN_API_KEY: ${{ secrets.EOJN_API_KEY }}

      - name: Rebuild reference tables
        if: always()
        run: |
          opcina master
          opcina postcodes
          git diff --stat -- config/ || true

      - name: Parse, quality gate, export
        if: always()
        run: opcina build ${ACCEPT:+--accept $ACCEPT}
        env:
          ACCEPT: ${{ inputs.accept }}

      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/interim
          key: data-${{ github.run_id }}

      - name: Upload reports and website data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: |
            data/raw/source_runs.jsonl
            data/interim/quality_report.json
            pipeline/config/municipalities.csv
            pipeline/config/postcodes.csv
            web/public/data/
          retention-days: 30
